<!doctype html>
<html lang="pt-BR">
<head>

<meta property="og:title" content="Bread King Palhoça | Cardápio e delivery"/><meta property="og:description" content="Pães, salgados, pizzas e confeitaria congelados, prontos em minutos."/><meta property="og:type" content="website"/>

<body>
<div class="min-h-screen bg-background">

</main>
<footer class="footer-gradient text-white"></footer>
</div>
<script>document.querySelectorAll("[data-icone]").forEach(function(s){s.outerHTML=icone(s.dataset.icone,s.dataset.cls||"h-5 w-5");});</script>
